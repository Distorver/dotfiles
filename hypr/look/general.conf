source = ~/.config/hypr/look/colors.conf

general {
    gaps_in = 3
    gaps_out = 7

    border_size = 2

    col.active_border = $color7 $color3 90deg
    col.inactive_border = $color1
    bezier = linear, 0.0, 0.0, 1.0, 1.0

    resize_on_border = false
    allow_tearing = false

    layout = dwindle
}